services:
  nats:
    image: nats:2.15.1-alpine
    command: ['--jetstream', '--store_dir', '/data', '--http_port', '8222']
    ports:
      - '127.0.0.1:4222:4222'
      - '127.0.0.1:8222:8222'
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '--spider',
          'http://localhost:8222/healthz?js-enabled-only=true',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  nats-data:
